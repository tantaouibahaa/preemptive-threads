[package]
name = "preemptive-threads"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Nathan Ryver <tantaouisoftware@gmail.com>"]
description = "Bare-metal preemptive SMP threading and EL0 user-process support for AArch64 (Raspberry Pi Zero 2 W and QEMU virt)"
license = "MIT"
repository = "https://github.com/tantaouibahaa/preemptive-threads"
keywords = ["threading", "no-std", "raspberry-pi", "bare-metal", "aarch64"]
categories = ["no-std", "embedded", "concurrency", "os"]
readme = "README.md"
# The library only: not the recording or the pt-os programs.
exclude = ["/docs/demo.gif", "/user"]
build = "build.rs"

[dependencies]
linked_list_allocator = { version = "0.10", default-features = false, features = ["const_mut_refs"] }

[features]
default = []
# Target the QEMU `virt` machine (GICv2, PSCI, PL011 at 0x0900_0000).
# Without this feature the crate targets BCM2837 boards: Raspberry Pi Zero 2 W,
# Raspberry Pi 3 and QEMU `raspi3b`.
qemu-virt = []
# Allow `arch::semihosting::exit` to terminate QEMU with an exit code.
# Only enable for emulator builds: on real hardware a semihosting call traps.
semihosting = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
debug = true

[[example]]
name = "rpi_kernel"
path = "examples/rpi_kernel.rs"

[[example]]
name = "test_kernel"
path = "examples/test_kernel.rs"

# The core crate stays at the root (plain `cargo build` builds only it);
# `os/` is the kernel binary (processes, system calls, VFS, console);
# `user/` the programs that run at EL0: `ulib` (the user library), `bin`
# (the userland: sh, ls, cat, top, ...) and `tests` (kernel-test programs).
[workspace]
members = [".", "os", "user/ulib", "user/bin", "user/tests"]

# User programs are embedded into the kernel image: keep them small.
[profile.release.package.pt-user-tests]
debug = false
strip = true

[profile.release.package.pt-userland]
debug = false
strip = true

[profile.release.package.ulib]
debug = false

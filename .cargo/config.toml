# Bare-metal AArch64 build configuration.
#
# The linker script is selected by build.rs (rpi0w2.ld by default,
# qemu_virt.ld with the `qemu-virt` feature).

[build]
target = "aarch64-unknown-none"

# cortex-a53 implies the optional Crypto extension (+aes, +sha2), which
# the BCM2837 does not implement: an AES or SHA instruction would be
# UNDEFINED on the Pi. `make sdkit` checks that no image contains one.
[target.aarch64-unknown-none]
rustflags = [
    "-C", "target-cpu=cortex-a53",
    "-C", "target-feature=-aes,-sha2",
    "-C", "link-arg=-nostdlib",
]

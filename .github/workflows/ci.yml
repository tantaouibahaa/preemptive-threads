name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build for the target platform (Raspberry Pi Zero 2 W)
  build-bare-metal:
    name: Build (aarch64 bare-metal)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Build library
        run: cargo build --release
      - name: Build kernel example
        run: cargo build --release --example rpi_kernel

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (bare-metal)
        run: cargo clippy
